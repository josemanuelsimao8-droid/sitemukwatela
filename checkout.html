<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mukwatela | Checkout</title>
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body data-page="checkout">
    <header class="site-header" id="top">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="Voltar ao início">
          <img class="brand-logo" src="assets/logotipo%20.png" alt="Mukwatela logo" />
        </a>
        <nav class="main-nav" aria-label="Navegação principal">
          <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="services.html">Serviços</a></li>
            <li><a href="portfolio.html">Portfólio</a></li>
            <li><a href="contactos.html">Contactos</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <a class="btn btn-secondary" href="dashboard.html">Dashboard</a>
          <a class="btn btn-whatsapp" href="https://wa.me/975397984?text=Olá%2C%20gostaria%20de%20solicitar%20um%20orçamento." target="_blank" rel="noreferrer">Falar no WhatsApp</a>
        </div>
      </div>
    </header>

    <main class="section checkout-shell">
      <div class="container checkout-layout">
        <div class="checkout-summary">
          <div class="panel-card checkout-panel">
            <h2>Resumo do serviço</h2>
            <div id="checkout-service-summary"></div>
          </div>
        </div>

        <div class="checkout-form-panel">
          <div class="panel-card checkout-panel">
            <h2>Dados do cliente</h2>
            <form id="checkout-form" class="checkout-form">
              <div class="field-row field-two">
                <div>
                  <label for="checkout-name">Nome</label>
                  <input id="checkout-name" name="name" type="text" required />
                </div>
                <div>
                  <label for="checkout-email">Email</label>
                  <input id="checkout-email" name="email" type="email" required />
                </div>
              </div>
              <div class="field-row">
                <label for="checkout-phone">Telefone</label>
                <input id="checkout-phone" name="phone" type="tel" required />
              </div>

              <div id="dynamic-service-fields" class="dynamic-service-fields"></div>

              <h3 class="checkout-subtitle">Pagamento</h3>
              <div class="payment-options">
                <label class="payment-option"><input type="radio" name="paymentMethod" value="Cartão bancário" checked /> Cartão bancário</label>
                <label class="payment-option"><input type="radio" name="paymentMethod" value="Cartão guardado" /> Cartão guardado</label>
                <label class="payment-option"><input type="radio" name="paymentMethod" value="Outro método" /> Outro método de pagamento</label>
              </div>

              <div class="field-row">
                <label for="card-name">Nome no cartão</label>
                <input id="card-name" name="cardName" type="text" placeholder="NOME NO CARTÃO" />
              </div>
              <div class="field-row field-three">
                <div>
                  <label for="card-number">Número do cartão</label>
                  <input id="card-number" name="cardNumber" type="text" inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456" />
                </div>
                <div>
                  <label for="card-expiry">Validade</label>
                  <input id="card-expiry" name="cardExpiry" type="text" placeholder="MM/AA" />
                </div>
                <div>
                  <label for="card-cvv">CVV</label>
                  <input id="card-cvv" name="cardCvv" type="password" maxlength="4" placeholder="***" />
                </div>
              </div>
              <label class="checkbox-row" for="save-card">
                <input id="save-card" name="saveCard" type="checkbox" />
                <span>Guardar este cartão para futuras compras</span>
              </label>
              <button class="btn btn-primary btn-block" type="submit">PAGAR AGORA</button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <script src="./js/company.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/mukwatela-demo.js"></script>
  </body>
</html>
