<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mukwatela | Nova palavra-passe</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body data-page="recovery">
  <main class="auth-page-shell">
    <section class="auth-layout container compact-auth">
      <div class="auth-panel auth-card register-card">
        <span class="eyebrow">Recuperação de acesso</span>
        <h1>Defina uma nova palavra-passe</h1>
        <p>Escolha uma nova palavra-passe para voltar a aceder à sua conta.</p>
        <form id="recovery-form" class="auth-form">
          <div id="auth-message" class="auth-message" hidden aria-live="polite"></div>
          <div class="field-row">
            <label for="new-password">Nova palavra-passe</label>
            <input id="new-password" name="password" type="password" minlength="6" required>
          </div>
          <div class="field-row">
            <label for="confirm-password">Confirmar palavra-passe</label>
            <input id="confirm-password" name="confirmPassword" type="password" minlength="6" required>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Atualizar palavra-passe</button>
          <a class="link-button" href="auth.html">Voltar ao login</a>
        </form>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
