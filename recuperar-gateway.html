<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mukwatela | Recuperar acesso</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="site-header" id="top">
    <div class="container nav-wrap">
      <a href="index.html" class="brand" aria-label="Voltar ao início">
        <img class="brand-logo" src="assets/logotipo%20.png" alt="Mukwatela logo">
      </a>
      <div class="header-actions">
        <a class="btn btn-secondary header-login" href="auth.html">Entrar</a>
      </div>
    </div>
  </header>

  <main class="auth-page-shell">
    <section class="auth-layout container compact-auth">
      <div class="auth-panel auth-card register-card">
        <span class="eyebrow">Segurança da conta</span>
        <h1>Confirmar recuperação</h1>
        <p id="gateway-text">O pedido de recuperação foi recebido. Clique no botão abaixo para continuar.</p>

        <div id="gateway-message" class="auth-message" hidden aria-live="polite"></div>

        <button id="continue-recovery" class="btn btn-primary btn-block" type="button">
          Continuar para redefinir a palavra-passe
        </button>

        <a class="link-button" href="auth.html">Voltar ao login</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase.js?v=20260927-recovery"></script>
  <script src="./js/recovery-gateway.js"></script>
</body>
</html>
