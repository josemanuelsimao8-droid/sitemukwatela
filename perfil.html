<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mukwatela | Perfil</title>
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body data-page="profile">
    <div class="app-shell">
      <aside class="app-sidebar">
        <div class="sidebar-brand">
          <a href="index.html" class="brand" aria-label="Voltar ao início">
            <img class="brand-logo" src="assets/logotipo%20.png" alt="Mukwatela logo" />
          </a>
        </div>
        <nav class="sidebar-nav" aria-label="Navegação do cliente">
          <a class="nav-link" href="dashboard.html">Visão geral</a>
          <a class="nav-link" href="services.html">Serviços</a>
          <a class="nav-link" href="compras.html">Minhas compras</a>
          <a class="nav-link" href="cartoes.html">Cartões</a>
          <a class="nav-link" href="notificacoes.html">Notificações</a>
          <a class="nav-link is-active" href="perfil.html">Perfil</a>
          <button class="nav-link nav-logout" type="button" data-logout> Sair </button>
        </nav>
      </aside>

      <main class="app-main">
        <header class="dashboard-topbar">
          <div>
            <p class="topbar-label">Área do cliente</p>
            <h1>Meu perfil</h1>
          </div>
        </header>

        <section class="panel-card dashboard-full-width">
          <form id="profile-form" class="profile-form">
            <div class="field-row field-two">
              <div>
                <label for="profile-name">Nome</label>
                <input id="profile-name" name="name" type="text" />
              </div>
              <div>
                <label for="profile-company">Empresa</label>
                <input id="profile-company" name="company" type="text" />
              </div>
            </div>
            <div class="field-row field-two">
              <div>
                <label for="profile-email">Email</label>
                <input id="profile-email" name="email" type="email" />
              </div>
              <div>
                <label for="profile-phone">Telefone</label>
                <input id="profile-phone" name="phone" type="tel" />
              </div>
            </div>
            <div class="field-row">
              <label for="profile-address">Morada</label>
              <input id="profile-address" name="address" type="text" />
            </div>
            <div class="inline-action-row">
              <button class="btn btn-secondary" type="button">Alterar palavra-passe</button>
              <button class="btn btn-primary" type="submit">Guardar alterações</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/company.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
