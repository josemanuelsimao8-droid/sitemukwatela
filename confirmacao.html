<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mukwatela | Confirmação de conta</title>
<link rel="icon" href="./public/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body data-page="auth">
<header class="site-header" id="top">
  <div class="container nav-wrap">
    <a href="index.html" class="brand" aria-label="Voltar ao início"><img class="brand-logo" src="assets/logotipo%20.png" alt="Mukwatela logo"></a>
    <nav class="main-nav" aria-label="Navegação principal"><ul>
      <li><a href="index.html">Início</a></li><li><a href="services.html">Serviços</a></li><li><a href="materiais.html">Materiais</a></li><li><a href="portfolio.html">Portfólio</a></li><li><a href="contactos.html">Contactos</a></li>
    </ul></nav>
    <div class="header-actions"><a class="header-cart-link" href="carrinho.html">Carrinho</a><a class="btn btn-secondary header-login" href="auth.html">Entrar</a></div>
  </div>
</header>
<main class="auth-page-shell">
  <section class="auth-layout container">
    <div class="auth-panel auth-visual">
      <span class="eyebrow">Confirmação de conta</span>
      <h1>Bem-vindo à Mukwatela.</h1>
      <p id="confirm-description">Estamos a confirmar o seu email.</p>
      <ul class="auth-feature-list"><li>Área privada do cliente</li><li>Acompanhamento de pedidos</li><li>Orçamentos e pagamentos</li></ul>
    </div>
    <div class="auth-panel auth-card">
      <div id="confirm-state" class="auth-message" aria-live="polite">A confirmar a sua conta...</div>
      <a id="confirm-action" class="btn btn-primary btn-block" href="auth.html" hidden>Entrar na minha conta</a>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const state=document.getElementById('confirm-state');
  const action=document.getElementById('confirm-action');
  const description=document.getElementById('confirm-description');
  const client=window.supabaseClient;
  if(!client){state.textContent='Não foi possível carregar o sistema de autenticação.';return;}
  const {data:{session}}=await client.auth.getSession();
  if(session?.user){
    state.textContent='Email confirmado com sucesso. A sua conta está ativa.';
    state.dataset.type='success';
    description.textContent='Já pode entrar e acompanhar os seus pedidos, orçamentos e pagamentos.';
    action.hidden=false;
    return;
  }
  const hash=new URLSearchParams(location.hash.replace(/^#/,''));
  const error=hash.get('error_description') || new URLSearchParams(location.search).get('error_description');
  if(error){
    state.textContent=decodeURIComponent(error.replace(/\+/g,' '));
    state.dataset.type='error';
    action.hidden=false;
    action.textContent='Voltar ao login';
    return;
  }
  state.textContent='O link de confirmação não criou uma sessão válida. Solicite um novo email de confirmação e tente novamente.';
  state.dataset.type='error';
  action.hidden=false;
});
</script>
</body>
</html>
